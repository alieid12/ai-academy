<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a1020"/>
<meta name="description" content="AI Academy: accessible adult education, from literacy and numeracy to programming and artificial intelligence."/>
<title>AI Academy — Learn without limits</title>
<style>
html,body{margin:0;min-height:100%;background:#080f1d;color:#eaf1fc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#boot{max-width:760px;margin:12vh auto;padding:30px}
#boot h1{font-size:clamp(2rem,6vw,4rem);letter-spacing:-.05em}
#boot p{color:#b2c4dc;line-height:1.7}
#boot a{color:#9dbdff}
#boot .tag{font-size:.8rem;color:#94b9ff;letter-spacing:.13em;font-weight:800}
</style>
<script>
function showAcademyError(title,detail){
 const boot=document.getElementById('boot');
 let container=boot||document.getElementById('academy-error-notice');
 if(!container){
  const app=document.getElementById('app');
  if(!app)return;
  container=document.createElement('section');
  container.id='academy-error-notice';
  container.setAttribute('role','alert');
  container.style.cssText='margin:16px auto;padding:18px;max-width:960px;border:2px solid #cf9553;border-radius:14px;background:#2c241b;color:#fff';
  app.prepend(container);
 }
 const heading=document.createElement('h2');
 heading.textContent=title;
 const message=document.createElement('p');
 message.textContent=detail;
 const link=document.createElement('a');
 link.href='https://github.com/alieid12/ai-academy/actions';
 link.textContent='See deployment status';
 link.style.color='#aaccff';
 container.replaceChildren(heading,message,link);
}
window.addEventListener('error',function(event){
 const detail=event && (event.message || (event.target && (event.target.src || event.target.href))) || 'Unknown JavaScript or resource error';
 showAcademyError('AI Academy encountered a problem.',String(detail)+'. Try reloading or check deployment status.');
},true);
window.addEventListener('unhandledrejection',function(event){
 const detail=event && event.reason && (event.reason.message || String(event.reason)) || 'Unexpected asynchronous error';
 showAcademyError('AI Academy encountered an unexpected error.',String(detail)+'. Try reloading or check deployment status.');
});
</script>
</head>
<body>
<div id="app">
 <main id="boot" role="status">
  <div class="tag">AI ACADEMY · LEARN WITHOUT LIMITS</div>
  <h1>Every expert started somewhere.</h1>
  <p>Loading your learning space. Build your skills from reading and mathematics to programming and artificial intelligence.</p>
  <p>If this message does not disappear, <a href="https://github.com/alieid12/ai-academy/actions">check the deployment</a>.</p>
 </main>
</div>
<noscript><p>AI Academy requires JavaScript. Enable JavaScript in your browser to use the interactive lessons.</p></noscript>
<script>
// If the application bundle cannot load, show a useful diagnosis instead of hanging.
window.__academyStarted = false;
window.setTimeout(function () {
  if (window.__academyStarted) return;
  const el = document.getElementById('boot');
  if (!el) return;
  el.innerHTML = '<div class="tag">AI ACADEMY</div><h1>Unable to open the academy</h1><p>The application did not start. The deployment may be successful even when a browser cannot load or execute the application bundle. Please send a screenshot of this error to the developer.</p><p><a href="https://github.com/alieid12/ai-academy/actions">Check deployment</a> · <a href="https://alieid12.github.io/ai-academy/?refresh=1">Try reloading</a></p>';
}, 9000);
</script>
<link rel="stylesheet" href="./src/style.css"/>
<script type="module" src="./src/main.js"></script>
</body>
</html>
